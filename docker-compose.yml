services:
  ngotra:
    build: .
    image: ngotra-ai:latest
    container_name: ngotra-ai
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      # Persist users, tokens, logs and settings across container restarts.
      - ./data:/app/data
    environment:
      # IMPORTANT: change these before exposing to the internet.
      - NGOTRA_JWT_SECRET=${NGOTRA_JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_STRING}
      - NGOTRA_COOKIE_KEY=${NGOTRA_COOKIE_KEY:-CHANGE_ME_TO_ANOTHER_LONG_RANDOM_STRING}
